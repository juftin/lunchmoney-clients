  /plaid_accounts/fetch:
    post:
      description: |-
        Use this endpoint to trigger a fetch for latest data from Plaid.<br><br>
        Eligible accounts are those who last_fetch value is over 1 minute ago. (Although the limit is every minute, please use this endpoint sparingly!) Successive calls to this endpoint under a minute after the first will return a 425 TOO EARLY response.<br><br>
        Successful calls will return a 202 ACCEPTED response. Note that fetching from Plaid is a background job. This endpoint simply queues up the job. You may track the `plaid_last_successful_update`, `last_fetch` and `last_import` properties to verify the results of the fetch. The `last fetch` property is updated when Plaid accepts a request to fetch data. The `plaid_last_successful_update`is updated when it successfully contacts the associated financial institution. The `last_import` field is updated only when new transactions have been imported.
      operationId: triggerPlaidAccountFetch
      parameters:
      - description: "Denotes the beginning of the time period to fetch transactions\
          \ for. If omitted, the most recent transactions will be returned. <br> Required\
          \ if end_date exists. <br>"
        explode: true
        in: query
        name: start_date
        required: false
        schema:
          format: date
          type: string
        style: form
      - description: 'Denotes the end of the time period you''d like to get transactions
          for. Required if start_date exists. '
        explode: true
        in: query
        name: end_date
        required: false
        schema:
          format: date
          type: string
        style: form
      - description: Specific ID of a plaid account to fetch. If not set the endpoint
          will trigger a fetch for all eligible accounts.
        examples:
          basic manual account:
            summary: Basic manual account by id request
            value: 119807
          id not found:
            summary: Example of an id that doesn't exist
            value: 9999999999999
        explode: true
        in: query
        name: id
        required: false
        schema:
          format: int32
          type: integer
        style: form
      responses:
        "202":
          description: "A 202 ACCEPTED status is returned if Plaid acknowledged the\
            \ fetch request. This indicates that it is possible to subsequently query\
            \ the `GET /plaid_accounts` endpoint to determine if the request was successful\
            \ (`plaid_last_successful_update` is more recent than `last_fetch), or\
            \ if new transactions were synced (`last_import` is more recent than `last_fetch`).<br>"
        "400":
          content:
            application/json:
              examples:
                missing end_date:
                  value:
                    message: Invalid Request Parameters
                    errors:
                    - errMsg: Both 'start_date' and 'end_date' must be specified.
