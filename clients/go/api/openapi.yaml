  /categories:
    get:
      description: Retrieve a list of all categories associated with the user's account.
      operationId: getAllCategories
      parameters:
      - description: "If `nested`, returns top-level categories (either category groups\
          \ or categories not part of a category group) in alphabetical order. Grouped\
          \ categories are nested within the category group under the property `children`.\
          \ A `flattened`, response is similar but it includes grouped categories\
          \ at the top level.<br/><br/> Categories are sorted by their `order`. When\
          \ `order` is null, they are listed in alphabetical order below other categories\
          \ with an `order`."
        explode: true
        in: query
        name: format
        required: false
        schema:
          default: nested
          enum:
          - nested
          - flattened
          type: string
        style: form
      - description: "If `false`, only categories not part of a category group are\
          \ returned.<br> If `true`, only category groups are returned.<br> When set,\
          \ the `format` parameter is ignored."
        explode: true
        in: query
        name: is_group
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                nested response:
                  value:
                    categories:
                    - id: 86
                      name: Automobile
                      description: Auto related categories
                      is_income: false
                      exclude_from_budget: false
                      exclude_from_totals: false
                      updated_at: 2025-02-28T09:49:03.238Z
                      created_at: 2025-01-28T09:49:03.238Z
                      is_group: true
                      order: 2
                      collapsed: false
                      archived: false
                      group_id: null
                      archived_at: null
                      children:
                      - id: 315174
                        name: Fuel
                        description: Fuel and gas expenses
                        is_income: false
                        exclude_from_budget: false
                        exclude_from_totals: false
                        updated_at: 2025-02-28T09:49:03.238Z
                        created_at: 2025-01-28T09:49:03.238Z
                        is_group: false
                        order: 1
                        collapsed: false
                        archived: false
                        group_id: 86
                        archived_at: null
                      - id: 315175
                        name: Maintenance
                        description: Car maintenance and repairs
                        is_income: false
                        exclude_from_budget: false
                        exclude_from_totals: false
                        updated_at: 2025-02-28T09:49:03.238Z
                        created_at: 2025-01-28T09:49:03.238Z
                        is_group: false
                        order: 2
                        collapsed: false
                        archived: false
                        group_id: 86
                        archived_at: null
                    - id: 83
                      name: Rent
