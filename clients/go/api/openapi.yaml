      - status
      - tag_ids
      - to_base
      - updated_at
      type: object
    insertTransactionObject:
      additionalProperties: false
      properties:
        date:
          description: Date of transaction in ISO 8601 format
          format: date
          type: string
        amount:
          $ref: "#/components/schemas/insertTransactionObject_amount"
        currency:
          allOf:
          - $ref: "#/components/schemas/currencyEnum"
          description: "Three-letter lowercase currency code of the transaction in\
            \ ISO 4217 format. Must match one of the [supported currencies](https://alpha.lunchmoney.dev/v2/currencies).\
            \ If not set defaults to the user account's primary currency."
        payee:
          description: Name of payee for the transaction
          maxLength: 140
          minLength: 0
          type: string
        original_name:
          description: "Original payee name. If not provided, defaults to `payee`\
            \ value."
          maxLength: 140
          minLength: 0
          nullable: true
          type: string
        category_id:
          description: "The ID of the category associated with the transactions. If\
            \ set, the category ID must exist for the user's account and it cannot\
            \ be a category group."
          format: int32
          nullable: true
          type: integer
        notes:
          description: |
            Any transaction notes set by the user or by
            a matched recurring item. This will match the value
            displayed in notes field on the transactions page in the GUI.
          maxLength: 350
          minLength: 0
          nullable: true
          type: string
        manual_account_id:
          description: "The Unique identifier for the associated manually managed\
            \ account. If set, this must match an existing manual account id associated\
            \ with the user's account. If not set, and `plaid_account_id` is also\
            \ not set, no account is associated with the transaction and it will appear\
            \ as a \"Cash Transaction\" in the Lunch Money GUI. It is an error if\
            \ this, and `plaid_account_id` is also set on the same transaction."
          format: int32
          nullable: true
          type: integer
        plaid_account_id:
          description: "The Unique identifier for the associated plaid synced account.\
            \ If set, this must match an existing plaid account id associated with\
            \ the user's account. If not set, and `manual_account_id` is also not\
            \ set, no account is associated with the transaction and it will appear\
            \ as a \"Cash Transaction\" in the Lunch Money GUI. It is an error if\
            \ this, and `manual_account_id` is also set on the same transaction. In\
            \ addition the specified plaid account must have the \"Allow Modifications\
            \ To Transactions\" property set (which is enabled by default), or the\
            \ insert will fail."
          format: int32
          nullable: true
          type: integer
        recurring_id:
          description: Unique identifier for associated recurring item. Recurring
            item must be associated with the same account.
          format: int32
          nullable: true
          type: integer
        status:
          description: "If set must be either `reviewed` or `unreviewed`. If not set,\
            \ defaults to `unreviewed`."
          enum:
          - reviewed
          - unreviewed
          type: string
        tag_ids:
          description: "A list of IDs for the tags associated with this transaction.\
            \ Each ID must match an existing tag associated with the user's account.\
            \ If not set, no tags will be associated with the created transaction."
          items:
            format: int32
            type: integer
          nullable: false
          type: array
        external_id:
          description: "A user-defined external ID for the transaction. If set, and\
            \ `manual_account_id` is set, the creation of the new transaction will\
            \ fail if a transaction with this id already exists for the specified\
            \ manual account."
          maxLength: 75
          minLength: 0
          nullable: true
          type: string
        custom_metadata:
          additionalProperties: true
          description: "An optional JSON object that includes additional data related\
            \ to this transaction. This must be a valid JSON object and, when stringified,\
            \ must not exceed 4096 characters. This data may be available in the future\
            \ for processing by rules."
          nullable: true
          type: object
      required:
      - amount
      - date
      type: object
    updateTransactionObject:
      additionalProperties: false
      properties:
        id:
          description: System defined unique identifier of this transaction. Ignored
            if set.
          format: int64
          type: integer
          x-updatable: false
        date:
          description: Date of transaction in ISO 8601 format
          format: date
          type: string
          x-updatable: true
        amount:
          $ref: "#/components/schemas/updateTransactionObject_amount"
        currency:
          allOf:
          - $ref: "#/components/schemas/currencyEnum"
          description: Three-letter lowercase currency code of the transaction in
            ISO 4217 format.<br> May not be updated on transactions that belong to
            a synced account with the "Allow Modifications to Transactions" property
            disabled.
          x-updatable: true
        recurring_id:
          description: The unique identifier of the associated recurring item that
            this transaction matches.
          format: int32
          nullable: true
          type: integer
          x-updatable: true
        payee:
          description: |
            The new payee for the transaction.
          maxLength: 140
          minLength: 0
          type: string
          x-updatable: true
        original_name:
          description: Original payee name. Cannot be changed. Ignored if set.
          maxLength: 140
          minLength: 0
          nullable: true
          type: string
          x-updatable: false
        category_id:
          description: Unique identifier of the category for this transaction. Set
            this to null to clear the transaction's category.
          format: int32
          nullable: true
          type: integer
          x-updatable: true
        notes:
          description: |
            New notes for the transaction. Set this to an empty string to clear the existing notes.
          maxLength: 350
          minLength: 0
          nullable: true
          type: string
          x-updatable: true
        manual_account_id:
          description: The unique identifier of the manual account associated with
            this transaction. Set this to null to disassociate the transaction with
            an account. If set `plaid_account_id` may not also be set to a non null
            value. Moving an existing transaction to to another account will not work
            if the transaction belongs to a synced account who's "Allow Modifications
            to Transactions" property is not set.
          format: int32
          nullable: true
          type: integer
          x-updatable: true
        plaid_account_id:
          description: "The unique identifier of the plaid account associated with\
            \ this transaction. If set `manual_account_id` may not also be set to\
            \ a non null value. Attempting to modify this on a transaction associated\
            \ with a Plaid account will not work if the account's \"Allow Modifications\
            \ to Transactions\" property is not set. Similarly, this cannot be set\
            \ to an id associated with this type of locked Plaid account."
          format: int32
          nullable: true
          type: integer
          x-updatable: true
        tag_ids:
          description: "A list of tag_ids for the tags associated with this transaction.\
            \ If set, this property will overwrite any existing tags. Use `additional_tag_ids`\
            \ to add tags to the existing transaction's tags. Set this to an empty\
            \ array to remove all tags from a transaction. If set `additional_tag_ids`\
            \ may not be set."
          items:
            format: int32
            type: integer
          nullable: false
          type: array
          x-updatable: true
        additional_tag_ids:
          description: "A list of tag_ids for the tags associated with this transaction.\
            \ If set, the tags listed in this property be added to any existing transaction\
            \ tags. Use `tag_ids` to overwrite or clear transaction tags. If set `tag_ids`\
            \ may not be set."
          items:
            format: int32
            type: integer
          nullable: false
          type: array
          x-updatable: true
        external_id:
          description: A user-defined external ID for the transaction. The update
            will fail if the transaction does not also have a `manual_account_id`
            or if there is already an existing transaction with the same `manual_account_id`/`external_id`
            combination.
          maxLength: 75
          minLength: 0
          nullable: true
          type: string
          x-updatable: true
        custom_metadata:
          description: User defined JSON data that can be set or cleared via the API.
          nullable: true
          type: object
          x-updatable: true
        status:
          description: |
            Status of the transaction, may be one of:
            - `reviewed`: User has reviewed the transaction, or it was automatically marked as reviewed due to reviewed recurring_item logic
            - `unreviewed`: User has not reviewed the transaction and it does not match any reviewed recurring_items.
          enum:
          - reviewed
          - unreviewed
          type: string
          x-updatable: true
        to_base:
          description: System defined amount of this transaction in the user's primary
            currency. Ignored if set. Use `amount` to update the amount in the transaction.
          format: double
          type: number
          x-updatable: false
        is_pending:
          description: System defined flag set for pending transactions. Ignored if
            set.
          type: boolean
          x-updatable: false
        plaid_metadata:
          description: System set metadata from a Plaid account sync. Ignored if set.
          nullable: true
          type: object
          x-updatable: false
        created_at:
          description: System defined date and time of when the transaction was created.
            Ignored if set.
          format: date-time
          type: string
          x-updatable: false
        updated_at:
          description: System defined date and time of when the transaction was last
            updated. Ignored if set.
          format: date-time
          type: string
          x-updatable: false
        is_split_parent:
          description: System defined boolean indicating if this transaction was split.
            To split or unsplit a transaction use the `/transactions/split` endpoint.
            Ignored if set.
          type: boolean
          x-updatable: false
        children:
          description: An array of child transactions that exists when a transaction
            has been split or if the transaction is a group. Split
          items:
            $ref: "#/components/schemas/childTransactionObject"
          nullable: false
          type: array
          x-updatable: false and Grouped transactions may not be modified using this
            API. Ignored if set.
        split_parent_id:
          description: A transaction ID if this is a split transaction. Split transactions
            may not be modified this API. Use the `transactions/split` endpoint instead.
            Ignored if set.
          format: int64
          nullable: true
          type: integer
          x-updatable: false
        is_group_parent:
          description: System defined boolean indicating if this transaction represents
            a group of transactions. Grouped transactions may not be modified with
            this API. Use the `transactions/group` endpoint instead. Ignored if set.
          type: boolean
          x-updatable: false
        group_parent_id:
          description: A transaction group ID if this transaction is part of a group.
            Grouped transactions may not be modified with this API. Use the `transactions/group`
            endpoint instead. Ignored if set.
          format: int64
          nullable: true
          type: integer
          x-updatable: false
        source:
          description: |
            System defined original source of the transaction. Ignored if set.
          enum:
          - api
          - csv
          - manual
          - merge
          - plaid
          - recurring
          - rule
          - split
          - user
          nullable: true
          type: string
          x-updatable: false
      type: object
    splitTransactionObject:
      additionalProperties: false
      description: The object representing a split transaction
      properties:
        amount:
          $ref: "#/components/schemas/splitTransactionObject_amount"
        payee:
          description: The payee for the child transaction. Will inherit the original
            payee from the parent if not defined.
          maxLength: 140
          minLength: 0
          type: string
        date:
          description: Must be in ISO 8601 format (YYYY-MM-DD). Will inherit from
            the parent if not defined.
          format: date
          type: string
