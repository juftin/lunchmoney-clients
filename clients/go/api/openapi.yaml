    budgetObject:
      additionalProperties: false
      description: "A budget object represents a budgeted amount for a specific category\
        \ and budget period. Each budget entry is tied to a specific time period defined\
        \ by its `start_date`. The budget object includes information about the budget\
        \ amount, currency, period settings, and how future periods will be automatically\
        \ calculated."
      properties:
        id:
          description: System created unique identifier for the budget entry.
          format: int64
          type: integer
        category_id:
          description: The ID of the category this budget applies to.
          format: int32
          type: integer
        amount:
          description: The budgeted amount for this period.
          format: double
          type: number
        currency:
          allOf:
          - $ref: "#/components/schemas/currencyEnum"
          description: The currency of the budgeted amount in ISO 4217 format.
        start_date:
          description: The start date of the budget period in ISO 8601 format (YYYY-MM-DD).
            This represents the beginning of the period for which this budget applies.
          format: date
          type: string
        next_start_date:
          description: "The calculated start date of the next budget period based\
            \ on the category's period settings (granularity, quantity, and anchor_date).\
            \ This is useful for determining when the next budget period begins."
          format: date
          readOnly: true
          type: string
        notes:
          description: Optional notes associated with this budget period.
          nullable: true
          type: string
        auto_budget_type:
          description: The budget preset type that determines how future periods will
            be automatically calculated. `nothing` means no automatic calculation
            (budgets must be set manually for each period). `fixed` uses a fixed amount
            for all future periods. `spend` uses the previous period's spending amount.
            `budget` uses the previous period's budgeted amount.
          enum:
          - nothing
          - fixed
          - spend
          - budget
          readOnly: true
          type: string
        auto_budget_amount:
          description: "If `auto_budget_type` is `fixed`, this is the fixed amount\
            \ that will be used for future periods."
          format: double
          nullable: true
          readOnly: true
          type: number
        auto_budget_currency:
          allOf:
          - $ref: "#/components/schemas/currencyEnum"
          description: "If `auto_budget_type` is `fixed`, this is the currency of\
            \ the fixed amount."
          nullable: true
          readOnly: true
        rollover_option:
          description: The rollover setting for this category. `same category` means
            unspent funds roll over to the next period for this category. `available
            funds` means unspent funds are added to the available funds pool. `null`
            means rollover is disabled.
          enum:
          - same category
          - available funds
          nullable: true
          readOnly: true
          type: string
        granularity:
          description: "The granularity of the budget period (e.g., monthly, weekly,\
            \ twice a month). This is determined by the category's custom budget settings\
            \ or the account's default budget period settings."
          enum:
          - month
          - week
          - twice a month
          readOnly: true
          type: string
        quantity:
          description: "The quantity of granularity units that make up each budget\
            \ period. For example, if granularity is `week` and quantity is `2`, each\
            \ budget period is 2 weeks."
          format: int32
          readOnly: true
          type: integer
        is_group:
          description: "Whether the category is a category group. Category groups\
            \ can have their own budgets that apply to all subcategories, or subcategories\
            \ can have individual budgets."
          readOnly: true
          type: boolean
        group_id:
          description: "If this budget is for a subcategory, this is the ID of the\
            \ parent category group. `null` if this is not a subcategory."
          format: int32
          nullable: true
          readOnly: true
          type: integer
        created_at:
          description: The date and time when this budget entry was created (in ISO
            8601 extended format).
          format: date-time
          type: string
        updated_at:
          description: The date and time when this budget entry was last updated (in
            ISO 8601 extended format).
          format: date-time
          type: string
      required:
      - amount
      - auto_budget_type
      - category_id
      - created_at
      - currency
      - granularity
      - id
      - is_group
      - next_start_date
      - quantity
      - start_date
      - updated_at
      title: budget object
      type: object
    upsertBudgetRequestObject:
      additionalProperties: false
      properties:
        start_date:
          description: Start date of the budget period in ISO 8601 date format (YYYY-MM-DD).
            Must be a valid budget period start for the account.
          format: date
          type: string
        category_id:
          description: Category ID for the budget
          format: int32
          type: integer
        amount:
          $ref: "#/components/schemas/upsertBudgetRequestObject_amount"
        currency:
          allOf:
          - $ref: "#/components/schemas/currencyEnum"
          description: "Three-letter currency code. If omitted, the primary currency\
            \ for the user's account is used."
        notes:
          description: Optional notes for the budget period
          maxLength: 350
          minLength: 0
          nullable: true
          type: string
      required:
      - amount
      - category_id
      - start_date
      type: object
    budgetUpsertResponseObject:
      example:
        to_base: 6.0274563
        amount: amount
        notes: notes
        category_id: 0
        currency: currency
        start_date: 2000-01-23
      properties:
        category_id:
          description: Category ID
          format: int32
          type: integer
        start_date:
          description: Start date of the budget period
          format: date
          type: string
        amount:
          description: Budget amount in the stored currency (string for consistency
            with other amount fields in the API)
          type: string
        currency:
          description: Currency code for the budget
          type: string
        to_base:
          description: Amount converted to the user's primary currency
          format: float
          type: number
        notes:
          description: Notes for the budget period
          nullable: true
          type: string
      type: object
    budgetSettingsResponseObject:
      additionalProperties: false
      description: Budget period and display settings
      example:
        budget_period_anchor_date: 2000-01-23
        budget_rollover_left_to_budget: false
        budget_use_last_day_of_month: false
        budget_period_granularity: day
        budget_hide_no_activity: false
        budget_period_quantity: 0.8008281904610115
        budget_income_option: max
      properties:
        budget_period_granularity:
          description: Budget period granularity
          enum:
          - day
          - week
          - month
          - year
          - twice a month
          type: string
        budget_period_quantity:
          description: The number of `granularity` units that make up a single budgeting
            period.
          format: double
          type: number
        budget_period_anchor_date:
          description: The date from which the budgeting period is calculated. All
            future (and past) periods are derived by applying `quantity` × `granularity`
            forward and backward from this date.
          format: date
          type: string
        budget_hide_no_activity:
          default: false
          description: The display preference for hiding categories in budget view
            that have no activity and no budgeted value
          type: boolean
        budget_use_last_day_of_month:
          default: false
          description: The display preference for using the last day of the month
            as the period end for monthly periods
          type: boolean
        budget_income_option:
          description: Determines which income value is used as the base when calculating
            available funds for a budgeting period
          enum:
          - max
          - budgeted
          - activity
          type: string
        budget_rollover_left_to_budget:
          default: false
          description: Determines whether the remaining unallocated funds (“Left to
            Budget”) at the end of a budgeting period are carried forward to the next
            period
          type: boolean
      required:
      - budget_hide_no_activity
      - budget_income_option
      - budget_period_anchor_date
      - budget_period_granularity
      - budget_period_quantity
      - budget_rollover_left_to_budget
      - budget_use_last_day_of_month
      type: object
