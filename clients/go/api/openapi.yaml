        id:
          description: System created unique identifier for transaction
          format: int64
          type: integer
        date:
          description: Date of transaction in ISO 8601 format
          format: date
          type: string
        amount:
          description: "Amount of the transaction in numeric format to 4 decimal places.\
            \ Positive values indicate a debit transaction, negative values indicate\
            \ a credit transaction."
          type: string
        currency:
          allOf:
          - $ref: "#/components/schemas/currencyEnum"
          description: Three-letter lowercase currency code of the transaction in
            ISO 4217 format.
        to_base:
          description: "The amount converted to the user's primary currency. If the\
            \ multi-currency feature is not being used, to_base and amount will be\
            \ the same. Positive values indicate a debit transaction, negative values\
            \ indicate a credit transaction."
          format: double
          type: number
        recurring_id:
          description: The unique identifier of the associated recurring item that
            this transaction matched.
          format: int32
          nullable: true
          type: integer
        payee:
          description: |
            Name of payee set by the user, the financial institution, or by
            a matched recurring item. This will match the value
            displayed in payee field on the transactions page in the GUI.
          maxLength: 140
          minLength: 0
          type: string
        original_name:
          description: "Original payee name from the source (financial institution,\
            \ CSV, etc.). For Plaid transactions, this is the raw name before normalization.\
            \ For manual/API transactions, this typically matches `payee`. May be\
            \ null for older transactions."
          maxLength: 140
          minLength: 0
          nullable: true
          type: string
        category_id:
          description: "Unique identifier of associated category set by the user or\
            \ by a matched recurring_item.<br> Category details can be obtained by\
            \ passing the value of this property to the [Get A Single Category](../operations/getCategoryById)\
            \ API"
          format: int32
          nullable: true
          type: integer
        plaid_account_id:
          description: The unique identifier of the plaid account associated with
            this transaction. This will always be null if this transaction is associated
            with a manual account or if this transaction has no associated account
            and appears as a "Cash Transaction" in the Lunch Money GUI.
          format: int32
          nullable: true
          type: integer
        manual_account_id:
          description: The unique identifier of the manual account associated with
            this transaction. This will always be null if this transaction is associated
            with a synced account or if this transaction has no associated account
            and appears as a "Cash Transaction" in the Lunch Money GUI.
          format: int32
          nullable: true
          type: integer
        external_id:
          description: "A user-defined external ID for any transaction that was added\
            \ via csv import, `POST /transactions` API call, or manually added via\
            \ the Lunch Money GUI. No external ID exists for transactions associated\
            \ with synced accounts, and they cannot be added. For transactions associated\
            \ with manual accounts, the external ID must be unique as attempts to\
            \ add a subsequent transaction with the same external_id and manual_account_id\
            \ will be flagged as duplicates and fail."
          maxLength: 75
          minLength: 0
          nullable: true
          type: string
        tag_ids:
          description: "A list of tag_ids for the tags associated with this transaction.\
            \ If the transaction has no tags this will be an empty list.<br> Tag details\
            \ can be obtained by passing the value of this attribute as the `ids`\
            \ query parameter to the [List Tags](../operations/getTags) API"
          items:
            format: int32
            type: integer
          nullable: false
          type: array
        notes:
          description: |
            Any transaction notes set by the user or by
            a matched recurring item. This will match the value
            displayed in notes field on the transactions page in the GUI.
          maxLength: 350
          minLength: 0
          nullable: true
          type: string
        status:
          description: |
            Status of the transaction:
            - `reviewed`: User has reviewed the transaction, or it was automatically marked as reviewed due to reviewed recurring_item logic
            - `unreviewed`: User has not reviewed the transaction and it does not match any reviewed recurring_items. Note that any transactions where `is_pending` is true will be returned with a status of unreviewed.
            - `delete_pending`: The synced account deleted this transaction after it was updated by the user. Requires manual intervention.
          enum:
          - reviewed
          - unreviewed
          - delete_pending
          type: string
        is_pending:
          description: Denotes if the transaction is pending (not posted). Applies
            only to transactions in synced accounts and will always be false for transactions
            associated with manual accounts.
          type: boolean
        created_at:
          description: The date and time of when the transaction was created (in the
            ISO 8601 extended format).
          format: date-time
          type: string
        updated_at:
          description: The date and time of when the transaction was last updated
            (in the ISO 8601 extended format).
          format: date-time
          type: string
        is_split_parent:
          description: "If `true`, this transaction has been split into two or more\
            \ other transactions. By default, parent transactions are not returned\
            \ in call to `GET /transactions` but they can be queried directly by their\
            \ ID."
          type: boolean
        split_parent_id:
          description: "A transaction ID if this is a split transaction. Denotes the\
            \ transaction ID of the original, or parent, transaction. Is null if this\
            \ is not a split transaction"
          format: int64
          nullable: true
          type: integer
        is_group_parent:
          description: "`true` if this transaction represents a group of transactions.\
            \ If so, amount and currency represent the totalled amount of transactions\
            \ bearing this transaction's id as their group_parent_id. Amount is calculated\
            \ based on the user's primary currency."
          type: boolean
        group_parent_id:
          description: "Is set if this transaction is part of a group. Denotes the\
            \ ID of the grouped transaction this is now included in. By default the\
            \ transactions that were grouped are not returned in a call to `GET /transactions`\
            \ but they can be queried directly by calling the `GET /transactions/group/{id}`,\
            \ where the id passed is associated with a transaction where the `is_group_parent`\
            \ attribute is true"
          format: int64
          nullable: true
          type: integer
        children:
          description: "Exists only for transactions which are the parent of a split\
            \ transaction or for transaction groups. It will not exist in the response\
            \ unless the `include_children` query parameter is set to `true`.<br>\
            \ For parents of split transactions, it contains a list of the associated\
            \ transactions that it was split into. For transaction groups, it contains\
            \ the transactions that were grouped together. Examine the `is_split_parent`\
            \ and `is_group_parent` properties to determine which of these it is."
          items:
            $ref: "#/components/schemas/childTransactionObject"
          nullable: false
          type: array
        plaid_metadata:
          description: "If requested, the transaction's plaid_metadata that came when\
            \ this transaction was obtained. This will be a json object, but the schema\
            \ is variable. This is only present when the `include_metadata` query\
            \ parameter is set to true."
          nullable: true
          type: object
        custom_metadata:
          description: "If requested, the transaction's custom_metadata that was included\
            \ when the transaction was inserted via the API. This will be a json object,\
            \ but the schema is variable. This is only present when the `include_metadata`\
            \ query parameter is set to true."
          nullable: true
          type: object
        files:
          description: A list of objects that describe any attachments to the Transactions.
            This is only present when the `include_files` query parameter is set to
            true.
          items:
            $ref: "#/components/schemas/transactionAttachmentObject"
          nullable: false
          type: array
        source:
          description: |
            Source of the transaction:
            - `api`: Transaction was added by a call to the [POST /transactions](../operations/createTransaction) API
            - `csv`: Transaction was added via a CSV Import
            - `manual`: Transaction was created via the "Add to Cash" button on the Transactions page
            - `merge`: Transactions were originally in an account that was merged into another account
            - `plaid`: Transaction came from a Financial Institution synced via Plaid
            - `recurring`: Transaction was created from the Recurring page
            - `rule`: Transaction was created by a rule to split a transaction
            - `split`: Transaction was created by splitting another transaction
            - `user`: This is a legacy value and is replaced by either csv or manual
          enum:
          - api
          - csv
          - manual
          - merge
          - plaid
          - recurring
          - rule
          - split
          - user
          nullable: true
          type: string
