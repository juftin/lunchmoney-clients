          description: The date for a matching transaction within the specified range.
          format: date
          type: string
        transaction_id:
          description: The ID of a matching transaction within the specified range.
          type: integer
      type: object
    recurringObject_matches:
      description: "Details on expected, found and missing transactions for the specified\
        \ range. This will be `null` for recurring items with a `status` of `suggested`."
      example:
