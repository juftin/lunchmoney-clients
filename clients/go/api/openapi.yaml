            \ based on `external_id` will always occur regardless of how this property\
            \ is set."
          type: boolean
        skip_balance_update:
          default: false
          description: "If `true`, and new transactions include a `manual_account_id`,\
            \ the balances of these accounts will not be updated, when the transactions\
            \ are inserted."
          type: boolean
