            recurring_remaining: 1.4894159098541704
            other_activity: 1.2315135367772556
            uncategorized: 7.457744773683766
            uncategorized_recurring: 4.965218492984954
            uncategorized_count: 1
      properties:
        aligned:
          description: "`true` if start_date and end_date are aligned with the user's\
            \ budget period setting; `false` otherwise.<p> When the response is not\
            \ aligned, category `totals` will not include values for the `budgeted`\
            \ and `available` properties, so aligned responses are usually preferred.<p>\
            \ If unsure how to set an aligned date range, set a range of at least\
            \ one month and set the `include_occurrences` parameter to `true`. Then\
            \ examine the objects in the `occurrences` array for the first category\
            \ to find start and end dates that will produce aligned responses.  Setting\
            \ `include_past_budget_dates` to `true` will add the three budget periods\
            \ prior to the range in the `occurrences` array."
          type: boolean
        categories:
          items:
            $ref: "#/components/schemas/summaryCategoryObject"
          type: array
        totals:
          $ref: "#/components/schemas/summaryTotalsObject"
        rollover_pool:
          $ref: "#/components/schemas/summaryRolloverPoolObject"
      required:
      - aligned
      - categories
      title: summary object
      type: object
    summaryTotalsObject:
      additionalProperties: false
      description: Total inflow and outflow for the given date range.  This object
        is returned when the query parameter `include_totals` is set to `true`.
      example:
        outflow:
          recurring_expected: 6.84685269835264
          recurring_activity: 1.0246457001441578
          recurring_remaining: 1.4894159098541704
          other_activity: 1.2315135367772556
          uncategorized: 7.457744773683766
          uncategorized_recurring: 4.965218492984954
          uncategorized_count: 1
        inflow:
          recurring_expected: 6.84685269835264
          recurring_activity: 1.0246457001441578
          recurring_remaining: 1.4894159098541704
          other_activity: 1.2315135367772556
          uncategorized: 7.457744773683766
          uncategorized_recurring: 4.965218492984954
          uncategorized_count: 1
      properties:
        inflow:
          $ref: "#/components/schemas/summaryTotalsBreakdownObject"
        outflow:
          $ref: "#/components/schemas/summaryTotalsBreakdownObject"
      type: object
    summaryTotalsBreakdownObject:
      additionalProperties: false
      example:
        recurring_expected: 6.84685269835264
        recurring_activity: 1.0246457001441578
        recurring_remaining: 1.4894159098541704
        other_activity: 1.2315135367772556
        uncategorized: 7.457744773683766
        uncategorized_recurring: 4.965218492984954
        uncategorized_count: 1
      properties:
        other_activity:
          description: "Total amount, in the user's default currency, of non recurring\
            \ activity for the given date range"
          type: number
        recurring_activity:
          description: "Total amount, in the user's default currency, of recurring\
            \ activity that has occurred for the given date range"
          type: number
        recurring_remaining:
          description: "Total amount, in the user's default currency, of expected\
            \ recurring activity that has not yet occurred"
          type: number
        recurring_expected:
          description: "Total amount, in the user's default currency, of expected\
            \ recurring activity for the given date range"
          type: number
        uncategorized:
          description: "Total amount, in the user's default currency, of non recurring\
            \ activity coming from un-categorized transactions"
          type: number
        uncategorized_count:
          description: Number of un-categorized transactions for the given date range
          type: integer
        uncategorized_recurring:
          description: "Total amount, in the user's default currency, of recurring\
            \ activity coming from un-categorized transactions."
          type: number
      type: object
    summaryCategoryObject:
      additionalProperties: false
      description: List of each category's budget configuration and activity for the
        date range.
      example:
        occurrences:
        - end_date: 2000-01-23
          budgeted_currency: ""
          notes: notes
          recurring_activity: 3.616076749251911
          budgeted_amount: budgeted_amount
          in_range: true
          other_activity: 9.301444243932576
          start_date: 2000-01-23
          budgeted: 2.027123023002322
        - end_date: 2000-01-23
          budgeted_currency: ""
          notes: notes
          recurring_activity: 3.616076749251911
          budgeted_amount: budgeted_amount
          in_range: true
          other_activity: 9.301444243932576
          start_date: 2000-01-23
          budgeted: 2.027123023002322
        rollover_pool:
          budgeted_to_base: 4.145608029883936
          all_adjustments:
          - date: 2000-01-23
            to_base: 7.386281948385884
            amount: amount
            in_range: true
            currency: ""
          - date: 2000-01-23
            to_base: 7.386281948385884
            amount: amount
            in_range: true
            currency: ""
        category_id: 0
        totals:
          recurring_expected: 7.061401241503109
          recurring_activity: 1.4658129805029452
          recurring_remaining: 2.3021358869347655
          available: 5.637376656633329
          other_activity: 6.027456183070403
          budgeted: 5.962133916683182
      properties:
        category_id:
          description: ID of the category associated with the totals.
          type: integer
        totals:
          $ref: "#/components/schemas/summaryCategoryTotalsObject"
        occurrences:
          description: "A list of objects describing the budget activity for each\
            \ period within the range. This property is only present when `include_occurrences`\
            \ is true.<p> For aligned ranges, there is one occurrence for each budget\
            \ period in the range; for non-aligned, only periods fully contained in\
            \ the range are included.<p> If `include_past_budget_dates` is also `true`,\
            \ the three budget periods prior to the range are also included."
          items:
            $ref: "#/components/schemas/summaryCategoryOccurrenceObject"
          type: array
        rollover_pool:
          $ref: "#/components/schemas/summaryRolloverPoolObject"
      required:
      - category_id
      - totals
      type: object
    summaryRolloverPoolAdjustmentObject:
      additionalProperties: false
      description: The date and adjusted balance of the rollover pool at the time
        of the adjustment.
      example:
        date: 2000-01-23
        to_base: 7.386281948385884
        amount: amount
        in_range: true
        currency: ""
      properties:
        in_range:
          description: true if this rollover pool adjustment is for a budget period
            that falls within the given date range.
          type: boolean
        date:
          description: Date the adjustment was made.
          format: date
          type: string
        amount:
          description: "Amount of the rollover pool, in the budgets currency, at the\
            \ time of the adjustment."
          type: string
        currency:
          allOf:
          - $ref: "#/components/schemas/currencyEnum"
          description: Currency of the rollover pool at the time of the adjustment.
        to_base:
          description: "Amount of the rollover pool, in the user's default currency,\
            \ at the time of the adjustment."
          type: number
      required:
      - amount
      - currency
      - date
      - in_range
      - to_base
      type: object
    summaryCategoryTotalsObject:
      additionalProperties: false
      description: Total activity for the given category within the given date range
        which is aligned with budget period setting.
      example:
        recurring_expected: 7.061401241503109
        recurring_activity: 1.4658129805029452
        recurring_remaining: 2.3021358869347655
        available: 5.637376656633329
        other_activity: 6.027456183070403
        budgeted: 5.962133916683182
      properties:
        other_activity:
          description: "Total non recurring activity, in the user's default currency,\
            \ for the category within the given date range.<br> The total activity\
            \ for the category is the sum of this and the recurring_activity."
          type: number
        recurring_activity:
          description: "Total recurring activity, in the user's default currency,\
            \ for the category within the given date range.<br> The total activity\
            \ for the category is the sum of this and the other_activity."
          type: number
        budgeted:
          description: "Total budgeted amount, in the user's default currency, for\
            \ the category within the given date range or null if the category is\
            \ not budgeted. This property will not be present in a non-aligned response."
          nullable: true
          type: number
        available:
          description: "Total amount of funds available, in the user's default currency,\
            \ for the category within the given date range. This property will not\
            \ be present in a non-aligned response."
          nullable: true
          type: number
        recurring_remaining:
          description: "Total expected recurring activity, in the user's default currency,\
            \ that has not yet occurred for the category within the given date range."
          type: number
        recurring_expected:
          description: Total expected recurring activity for the category within the
            given date range.
          type: number
      required:
      - other_activity
      - recurring_activity
      - recurring_expected
      - recurring_remaining
      type: object
    summaryCategoryOccurrenceObject:
      additionalProperties: false
      description: ""
      example:
        end_date: 2000-01-23
        budgeted_currency: ""
        notes: notes
        recurring_activity: 3.616076749251911
        budgeted_amount: budgeted_amount
        in_range: true
        other_activity: 9.301444243932576
        start_date: 2000-01-23
        budgeted: 2.027123023002322
      properties:
        in_range:
          description: "`true` if this occurrence is within the given date range,\
            \ `false` if it was included because the `include_past_budget_periods`\
            \ parameter was set to `true`."
          type: boolean
        start_date:
          description: The start date of the budget period
          format: date
          type: string
        end_date:
          description: The end date of the budget period
          format: date
          type: string
        other_activity:
          description: "Total non recurring activity, in the user's default currency,\
            \ for the budget period. The total activity for this category in the period\
            \ is the sum of this and the recurring_activity."
          type: number
        recurring_activity:
          description: "Total recurring activity, in the user's default currency,\
            \ for the budget period. The total activity for this category in the budget\
            \ period is the sum of this and the other_activity."
          type: number
        budgeted:
          description: "Total budgeted amount, in the user's primary currency, for\
            \ the period, or `null` if no budget was set."
          nullable: true
          type: number
        budgeted_amount:
          description: "Total budgeted amount, in the budgeted currency, for the category\
            \ within the period, or `null` if no budget was set."
          nullable: true
          type: string
        budgeted_currency:
          allOf:
          - $ref: "#/components/schemas/currencyEnum"
          description: Currency of the budgeted amount
          nullable: true
        notes:
          description: Any notes set for the budget period.
          nullable: true
          type: string
      required:
      - budgeted
      - budgeted_amount
      - budgeted_currency
      - end_date
      - in_range
      - notes
      - other_activity
      - recurring_activity
      - start_date
      type: object
    summaryRecurringTransactionObject:
