        date:
          description: Date for the new grouped transaction in ISO 8601 format.
          format: date
          type: string
        payee:
          description: |
            The payee for the new grouped transaction.
          maxLength: 140
          minLength: 0
          type: string
        category_id:
          description: "The ID of an existing category to assign to the grouped transaction.\
            \ If not set and all the grouped transactions have the same category,\
            \ the grouped transaction will inherit the category, otherwise the new\
            \ transaction will have no category."
          format: int64
          nullable: true
          type: integer
        notes:
          description: |
            Notes for the grouped transaction.
          maxLength: 350
          minLength: 0
          nullable: true
          type: string
        status:
          description: "If set must be either `reviewed` or `unreviewed`. If not set,\
            \ defaults to `reviewed`."
          enum:
          - reviewed
          - unreviewed
          type: string
        tag_ids:
          description: "A list of IDs for the tags associated with the grouped transaction.\
            \ Each ID must match an existing tag associated with the user's account.\
            \ If not set, no tags will be associated with the created transaction."
          items:
            format: int64
            type: integer
          type: array
      required:
      - date
      - ids
      - payee
      type: object
