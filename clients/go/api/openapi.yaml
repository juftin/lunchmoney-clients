                    created_at: 2024-07-24T17:00:06.192Z
                    updated_at: 2024-07-24T17:00:06.192Z
                    split_parent_id: null
                    children: []
                    is_group_parent: false
                    group_parent_id: null
                    manual_account_id: null
                    plaid_account_id: 119805
                    tag_ids: []
                    source: csv
