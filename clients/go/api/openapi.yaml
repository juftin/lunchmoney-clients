paths:
  /me:
    get:
      description: Get details about the user associated with the supplied authorization
        token.
      operationId: getMe
      parameters: []
      responses:
        "200":
          content:
            application/json:
              example:
                name: User 1
                email: user-1@lunchmoney.dev
                id: 18328
                account_id: 18221
                budget_name: \U0001F3E0 Family budget
                primary_currency: usd
                api_key_label: Side project dev key
              schema:
                $ref: "#/components/schemas/userObject"
          description: The User Object associated with the authorized token.
        "401":
          content:
            application/json:
              example:
                message: Unauthorized
                errors:
                - errMsg: Access token does not exist.
              schema:
                $ref: "#/components/schemas/errorResponseObject"
          description: Unauthorized. This error occurs when an invalid API token is
            passed to the request.
        "429":
          content:
            application/json:
              example:
                message: Too Many Requests
                errors:
                - errMsg: "Too many requests, please try again later."
              schema:
                $ref: "#/components/schemas/errorResponseObject"
          description: Too Many Requests. Retry your request after the number of seconds
            specified in the retry-after header.
        "500":
          content:
            application/json:
              example:
                message: Internal Server Error
                errors:
                - errMsg: Currently in maintenance mode. Please try again in a few
                    minutes.
              schema:
                $ref: "#/components/schemas/errorResponseObject"
          description: Internal Server Error. Contact support.
      summary: Get current user
      tags:
      - me
  /summary:
    get:
      description: "Retrieves a summary of the user's budget. Use this endpoint to\
        \ access budget configuration details and performance for a specified date\
        \ range.<p> Use the [/budgets](#tag/budgets) endpoint to manage budget objects."
      operationId: getBudgetSummary
      parameters:
      - description: Start of date range in ISO 8601 date format (YYYY-MM-DD).
        examples:
          aligned monthly:
            description: First day of month for aligned budget periods
            summary: Start date for monthly budget period
            value: 2025-07-01
          not aligned:
            description: Date that doesn't align with budget periods
            summary: Start date for non-aligned period
            value: 2025-07-02
        explode: true
        in: query
        name: start_date
        required: true
        schema:
          format: date
          type: string
        style: form
      - description: End of date range in ISO 8601 date format (YYYY-MM-DD).
        examples:
          aligned monthly:
            description: Last day of month for aligned budget periods
            summary: End date for monthly budget period
            value: 2025-08-31
          not aligned:
            description: Date that doesn't align with budget periods
            summary: End date for non-aligned period
            value: 2025-08-27
        explode: true
        in: query
        name: end_date
        required: true
        schema:
          format: date
          type: string
        style: form
      - description: Enable to include categories that have the 'Exclude from Budgets'
          flag set in the returned `categories` array.
        explode: true
        in: query
        name: include_exclude_from_budgets
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: Enable to include an `occurrences` array for each category in
          an aligned response. Each array will include an object for each budget period
          that falls within the specified date range which includes details on the
          activity for the budget period.
        explode: true
        in: query
        name: include_occurrences
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: Enable to include the three budget occurrences prior to the start
          date in the `occurrences` array for each category in an aligned response.
          This property is ignored if `include_occurrences` is not also set to `true`.
        explode: true
        in: query
        name: include_past_budget_dates
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: Enable to include a top-level `totals` section that summarizes
          the inflow and outflow across all transactions for the specified date range.
        explode: true
        in: query
        name: include_totals
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: Enable to include a `rollover_pool` section that summarizes the
          current rollover pool balance and all previous adjustments.
        explode: true
        in: query
        name: include_rollover_pool
        required: false
        schema:
          default: false
          type: boolean
        style: form
