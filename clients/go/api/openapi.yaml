          description: Unique identifier for associated category_id. Category must
            already exist for the account. Will inherit category from the parent if
            not defined.
          format: int32
          type: integer
        tag_ids:
          description: The IDs of any tags to apply to this split child transaction.
            Each ID must match an existing tag.
          items:
            format: int32
            type: integer
          type: array
        notes:
          description: Will inherit notes from parent if not defined.
          maxLength: 350
          type: string
      required:
      - amount
      type: object
