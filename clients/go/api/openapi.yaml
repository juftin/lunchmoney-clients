    recurringObject_transaction_criteria:
      description: The set of properties used to identify matching transactions.
      example:
        end_date: 2000-01-23
        payee: payee
        to_base: 1.4658129805029452
        amount: amount
        quantity: 6
        anchor_date: 2000-01-23
        granularity: day
        plaid_account_id: 5
        manual_account_id: 5
        currency: currency
        start_date: 2000-01-23
      properties:
        start_date:
          description: "The beginning of the date range for matching transactions.\
            \ If `null`, any transactions before end_date may be considered."
          format: date
          nullable: true
          type: string
        end_date:
          description: "The end of the date range for matching transactions. If `null`,\
            \ any transactions after start_date may be considered."
          format: date
          nullable: true
          type: string
        granularity:
          description: The unit of time used to define the cadence of the recurring
            item.
          enum:
          - day
          - week
          - month
          - year
          type: string
        quantity:
          description: The number of granularity units between each recurrence.
          type: integer
        anchor_date:
          description: The date used in conjunction with the `quantity` and `granularity`
            properties to calculate expected occurrences of recurring transactions.
          format: date
          nullable: false
          type: string
        payee:
          description: "If set, represents the original transaction payee name that\
            \ triggered this recurring item's creation."
          nullable: true
          type: string
        amount:
          description: The expected amount for a transaction that will match this
            recurring item. For recurring items that have a flexible amount this is
            the average of the specified min and max amounts.
          pattern: "^-?\\d+(\\.\\d{1,4})?$"
          type: string
        to_base:
          description: The amount converted to the user's primary currency
          type: number
        currency:
          description: Three-letter lowercase currency code of the recurring item.
          nullable: false
          type: string
        plaid_account_id:
          description: "The Plaid account ID associated with the recurring item, if\
            \ any."
          format: int64
          nullable: true
          type: integer
        manual_account_id:
          description: "The manual account ID associated with the recurring item,\
            \ if any."
          format: int64
          nullable: true
          type: integer
      required:
      - amount
      - anchor_date
      - currency
      - end_date
      - granularity
      - manual_account_id
      - payee
      - plaid_account_id
      - quantity
      - start_date
      - to_base
      type: object
    recurringObject_overrides:
      description: The values that will be applied to matching transactions.
      example:
        payee: payee
        notes: notes
        category_id: 2
      properties:
        payee:
          description: "If present, the payee name that will be displayed for any\
            \ matching transactions."
          nullable: false
          type: string
        notes:
          description: "If present, the notes that will be displayed for any matching\
            \ transactions."
          nullable: false
          type: string
        category_id:
          description: "If present, the ID of the category that matching transactions\
            \ will be assigned to."
          nullable: false
          type: integer
      type: object
    recurringObject_matches_found_transactions_inner:
      example:
        date: 2000-01-23
        transaction_id: 7
      properties:
