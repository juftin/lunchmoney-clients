    errorResponseObject:
      description: The object returned will any 4XX error response. Each response
        is guaranteed to have a `message` and at least one `error` object.
      example:
        message: message
        errors:
        - errMsg: errMsg
        - errMsg: errMsg
      properties:
        message:
          description: "High level error type, for example 'Not Found' or 'Request\
            \ Validation Failure'"
          type: string
        errors:
          description: "An list of objects that describe the errors encountered while\
            \ processing the request.<br> If multiple errors were encountered, the\
            \ list will contain multiple objects.<br> Each `error` object is guaranteed\
            \ to have an `errMsg`, but it may also contain other error specific properties."
          items:
            $ref: "#/components/schemas/errorResponseObject_errors_inner"
          type: array
      required:
      - errors
      - message
      title: error response object
      type: object
    budgetInvalidPeriodErrorObject:
