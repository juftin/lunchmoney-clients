          nullable: true
          type: string
        next_valid_start_date:
          description: The next valid budget period start date after the requested
            date
          format: date
          nullable: true
          type: string
        errMsg:
          description: Human-readable error message
          type: string
      required:
      - errMsg
      - message
      - requested_start_date
      type: object
