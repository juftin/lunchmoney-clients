          transaction_id: 7
        request_start_date: 2000-01-23
        request_end_date: 2000-01-23
        expected_occurrence_dates:
        - 2000-01-23
        - 2000-01-23
        missing_transaction_dates:
        - 2000-01-23
        - 2000-01-23
      nullable: true
      properties:
        request_start_date:
          description: The beginning of the date range that this request used to find
            matching transactions.
          format: date
          type: string
        request_end_date:
          description: The beginning of the date range that this request used to find
            matching transactions.
          format: date
          type: string
        expected_occurrence_dates:
          description: A list of dates within the specified range where a recurring
            transactions is expected.
          items:
            format: date
            type: string
          type: array
        found_transactions:
          description: A list with the dates and IDs of matching transactions.
          items:
            $ref: "#/components/schemas/recurringObject_matches_found_transactions_inner"
          type: array
        missing_transaction_dates:
          description: A list of dates within the range of where a recurring transaction
            was expected but none was found.
          items:
            format: date
            type: string
          type: array
      type: object
