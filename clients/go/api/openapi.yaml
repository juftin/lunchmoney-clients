  /budgets:
    delete:
      description: "Removes the budget for the given category and period. If there\
        \ already is no budget set for that period, the request still succeeds (idempotent).<p>\
        \ Note that `start_date` **must** be a valid budget period start for the account\
        \ (based on the account's budget period settings). If an invalid `start_date`\
        \ is provided, the request will fail with an error that indicates what the\
        \ previous and next valid start dates are.<p> Use the [budgets/settings](#tag/budgets/GET/budgets/settings)\
        \ endpoint to view the account's budget settings.<br> To view existing budgets\
        \ details use the [summary](#tag/summary) endpoint."
      operationId: deleteBudget
      parameters:
      - description: Category ID of the budget to delete
        explode: true
        in: query
        name: category_id
        required: true
        schema:
          format: int32
          type: integer
        style: form
      - description: Start date of the budget period in ISO 8601 date format (YYYY-MM-DD)
        explode: true
        in: query
        name: start_date
        required: true
        schema:
          format: date
          type: string
        style: form
      responses:
        "204":
          description: Budget deleted (or no budget existed for the given category
            and period)
        "400":
          content:
            application/json:
              examples:
                invalid period:
                  summary: Bad Category ID
                  value:
                    message: Invalid Request
                    errors:
                    - errMsg: The requested start date is not a valid budget period
                        start for this account.
                      requested_start_date: 2025-01-15
                      previous_valid_start_date: 2025-01-01
                      next_valid_start_date: 2025-02-01
                validation error:
                  summary: Invalid request body
                  value:
                    message: Invalid Request Body
                    errors:
                    - errMsg: Category ID does not exist
              schema:
                $ref: "#/components/schemas/upsertBudget_400_response"
          description: "Bad Request (invalid period start, invalid category, or validation\
            \ failure)"
        "401":
          content:
            application/json:
              example:
                message: Unauthorized
                errors:
                - errMsg: Access token does not exist.
              schema:
                $ref: "#/components/schemas/errorResponseObject"
          description: Unauthorized. This error occurs when an invalid API token is
            passed to the request.
        "429":
          content:
            application/json:
              example:
                message: Too Many Requests
                errors:
                - errMsg: "Too many requests, please try again later."
              schema:
                $ref: "#/components/schemas/errorResponseObject"
          description: Too Many Requests. Retry your request after the number of seconds
            specified in the retry-after header.
        "500":
          content:
            application/json:
              example:
                message: Internal Server Error
                errors:
                - errMsg: Currently in maintenance mode. Please try again in a few
                    minutes.
              schema:
                $ref: "#/components/schemas/errorResponseObject"
          description: Internal Server Error. Contact support.
      summary: Delete budget
      tags:
      - budgets
    put:
      description: |-
        Create or update a budget for a category and period.<p>
        If a budget already exists for the specified `start_date` and `category_id`, the `amount` (and optional `currency` and `notes`) are updated; otherwise a new budget entry is created.<p>

        Note that `start_date` **must** be a valid budget period start for the account (based on the account's
        budget period settings). If an invalid `start_date` is provided, the request will fail with an error that indicates what the previous and next valid start dates are.<p>

        Use the [budgets/settings](#tag/budgets/GET/budgets/settings) endpoint to view the account's budget settings.<br>
        To view existing budgets details use the [summary](#tag/summary) endpoint.
      operationId: upsertBudget
      requestBody:
        content:
          application/json:
            example:
              start_date: 2025-01-01
              category_id: 315177
              amount: 500
              currency: usd
              notes: Monthly groceries
            schema:
              $ref: "#/components/schemas/upsertBudgetRequestObject"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                category_id: 315177
                start_date: 2025-01-01
                amount: 500
                currency: usd
                to_base: 500.0
                notes: Monthly groceries
              schema:
                $ref: "#/components/schemas/budgetUpsertResponseObject"
          description: Budget upserted successfully
        "400":
          content:
            application/json:
              examples:
                invalid period:
                  summary: Start date not a valid budget period start
                  value:
                    message: Invalid Request
                    errors:
                    - errMsg: The requested start date is not a valid budget period
                        start for this account.
                      requested_start_date: 2025-01-15
                      previous_valid_start_date: 2025-01-01
                      next_valid_start_date: 2025-02-01
                validation error:
                  summary: Bad Category ID
                  value:
                    message: Invalid Request Body
                    errors:
                    - errMsg: Category ID does not exist
              schema:
                $ref: "#/components/schemas/upsertBudget_400_response"
          description: "Bad Request (invalid period start, invalid category, or validation\
            \ failure)"
        "401":
          content:
            application/json:
              example:
                message: Unauthorized
                errors:
                - errMsg: Access token does not exist.
              schema:
                $ref: "#/components/schemas/errorResponseObject"
          description: Unauthorized. This error occurs when an invalid API token is
            passed to the request.
        "429":
          content:
            application/json:
              example:
                message: Too Many Requests
                errors:
                - errMsg: "Too many requests, please try again later."
              schema:
                $ref: "#/components/schemas/errorResponseObject"
          description: Too Many Requests. Retry your request after the number of seconds
            specified in the retry-after header.
        "500":
          content:
            application/json:
              example:
                message: Internal Server Error
                errors:
                - errMsg: Currently in maintenance mode. Please try again in a few
                    minutes.
              schema:
                $ref: "#/components/schemas/errorResponseObject"
          description: Internal Server Error. Contact support.
      summary: Upsert budget
      tags:
      - budgets
