  /transactions:
    delete:
      description: |-
        Deletes the transaction with the IDs specified in the request body.<p>
        If any of the specified transactions are a split transaction or a split parent, or if any are a grouped transactions or part of a transaction group, the request will fail with a suggestion on how to unsplit or ungroup the transaction(s) prior to deletion. This will also fail if any of the specified transaction IDs do not exist.<p>
        Otherwise, the specified transactions are deleted.<p>
        <span class="red-text"><strong>Use with caution. This action is not reversible!</strong></span>
      operationId: deleteTransactions
      requestBody:
        content:
          application/json:
            examples:
              delete three transactions:
                value:
                  ids:
                  - 2112150653
                  - 2112150654
                  - 2112150655
              duplicate ids:
                value:
                  ids:
                  - 2112150653
                  - 2112150653
                  - 2112150654
                  - 2112150654
              invalid ids:
                value:
                  ids:
                  - 2112150653
                  - 9999999999
                  - 2112150654
            schema:
              $ref: "#/components/schemas/deleteTransactions_request"
        required: true
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              example:
                message: Invalid Request Body
                errors:
                - errMsg: "Duplicate transaction ID found: 2112150653"
                  transaction_id: 2112150653
                  ids_index: 0
                  invalid_property: ids
                - errMsg: "Duplicate transaction ID found: 2112150653"
                  transaction_id: 2112150653
                  ids_index: 1
                  invalid_property: ids
                - errMsg: "Duplicate transaction ID found: 2112150654"
                  transaction_id: 2112150654
                  ids_index: 2
                  invalid_property: ids
                - errMsg: "Duplicate transaction ID found: 2112150654"
                  transaction_id: 2112150654
                  ids_index: 3
                  invalid_property: ids
              schema:
                $ref: "#/components/schemas/errorResponseObject"
          description: Not Found
        "401":
          content:
            application/json:
              example:
                message: Unauthorized
                errors:
                - errMsg: Access token does not exist.
              schema:
                $ref: "#/components/schemas/errorResponseObject"
          description: Unauthorized. This error occurs when an invalid API token is
            passed to the request.
        "404":
          content:
            application/json:
              example:
                message: Request Validation Failure
                errors:
                - errMsg: "There is no transaction with the id: 8888888888"
                  ids_index: 0
                  id: 8888888888
                - errMsg: "There is no transaction with the id: 9999999999"
                  ids_index: 1
                  id: 9999999999
              schema:
                $ref: "#/components/schemas/errorResponseObject"
          description: Not Found
        "429":
          content:
            application/json:
              example:
                message: Too Many Requests
                errors:
                - errMsg: "Too many requests, please try again later."
              schema:
                $ref: "#/components/schemas/errorResponseObject"
          description: Too Many Requests. Retry your request after the number of seconds
            specified in the retry-after header.
        "500":
          content:
            application/json:
              example:
                message: Internal Server Error
                errors:
                - errMsg: Currently in maintenance mode. Please try again in a few
                    minutes.
              schema:
                $ref: "#/components/schemas/errorResponseObject"
          description: Internal Server Error. Contact support.
      summary: Bulk delete existing transactions
      tags:
      - transactions (bulk)
    get:
      description: "Retrieve a list of all transactions associated with a user's account.\
        \ <br>If called with no parameters, this endpoint will return the most recent\
        \ transactions up to `limit` number of transactions."
      operationId: getAllTransactions
      parameters:
      - description: "Denotes the beginning of the time period to fetch transactions\
          \ for. If omitted, the most recent transactions will be returned. See `limit`.\
          \ Required if end_date exists. <br>"
        explode: true
        in: query
        name: start_date
        required: false
        schema:
          format: date
          type: string
        style: form
      - description: 'Denotes the end of the time period you''d like to get transactions
          for. Required if start_date exists. '
        explode: true
        in: query
        name: end_date
        required: false
        schema:
          format: date
          type: string
        style: form
      - description: Filter transactions to those created after the specified timestamp.
          Accepts either a date (YYYY-MM-DD) or ISO 8601 datetime string. Date-only
          values are interpreted as midnight UTC (00:00:00Z).
        explode: true
        in: query
        name: created_since
        required: false
        schema:
          $ref: "#/components/schemas/getAllTransactions_created_since_parameter"
        style: form
      - description: Filter transactions to those updated after the specified timestamp.
          Accepts either a date (YYYY-MM-DD) or ISO 8601 datetime string. Date-only
          values are interpreted as midnight UTC (00:00:00Z).
        explode: true
        in: query
        name: updated_since
        required: false
        schema:
          $ref: "#/components/schemas/getAllTransactions_created_since_parameter"
        style: form
      - description: "Filter transactions to those associated with specified manual\
          \ account ID or set this to 0 to omit any transactions from manual accounts.\
          \ Setting both this and `plaid_account_id` to 0 will return transactions\
          \ with no account. These are listed as \"Cash Transactions\" in the Lunch\
          \ Money GUI.<br> Note that transaction groups are not associated with any\
          \ account. If you want the response to include transactions from transaction\
          \ groups, set the `include_group_children` query parameter to `true` when\
          \ filtering by manual accounts."
        examples:
          euro travel card:
            value: 219909
          no manual accounts:
            value: 0
        explode: true
        in: query
        name: manual_account_id
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: "Filter transactions to those associated with specified plaid\
          \ account ID or set this to 0 to omit any transactions from plaid accounts.\
          \ Setting both this and `manual_account_id` to 0 will return transactions\
          \ with no account. These are listed as \"Cash Transactions\" in the Lunch\
          \ Money GUI.<br> Note that transaction groups are not associated with any\
          \ account. If you want the response to include transactions from transaction\
          \ groups, set the `include_group_children` query parameter to `true` when\
          \ filtering by plaid accounts."
        examples:
          brokerage account:
            value: 119807
          no plaid accounts:
            value: 0
        explode: true
        in: query
        name: plaid_account_id
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: |
          Filter transactions to those associated with specified Recurring  Item ID
        examples:
          paychecks:
            value: 994069
          rent:
            value: 994079
        explode: true
        in: query
        name: recurring_id
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: Filter transactions to those associated with the specified category
          ID. Will also match category groups.  Set this to 0 to return only un-categorized
          transactions
        examples:
          rent:
            value: 83
          food category group:
            value: 84
        explode: true
        in: query
        name: category_id
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: Filter transactions to those that have a tag with the specified
          Tag ID
        explode: true
        in: query
        name: tag_id
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: Filter by group (returns only transaction groups if `true`)
        explode: true
        in: query
        name: is_group_parent
        required: false
        schema:
          type: boolean
        style: form
      - description: "Filter transactions to those with the specified status:<br>\
          \ - `reviewed`: Only user reviewed transactions or those that were automatically\
          \ marked as reviewed due to reviewed recurring_item logic<br> - `unreviewed`:\
          \ Only transactions that need to be reviewed<br> - `delete_pending`: Only\
          \ transactions that require manual intervention because the plaid account\
          \ deleted this transaction after it was updated by the user."
        examples:
          needs review:
            value: unreviewed
          needs deletion:
            value: delete_pending
        explode: true
        in: query
        name: status
        required: false
        schema:
          enum:
          - reviewed
          - unreviewed
          - delete_pending
          type: string
        style: form
      - description: |
          Filter transactions by pending status. Set to `true` to return only pending transactions, or `false` to return only non-pending transactions. When this parameter is set, it takes precedence over `include_pending`. Note: Pending transactions always have a status of `unreviewed`, so when setting this parameter to `true`, either omit the `status` parameter or set it to `unreviewed`.
        examples:
          only pending:
            value: true
          exclude pending:
            value: false
        explode: true
        in: query
        name: is_pending
        required: false
        schema:
          type: boolean
        style: form
      - description: |
          By default, pending transactions are excluded from results. Set to `true` to include imported transactions with a pending status in the results. This query param is ignored if the `is_pending` query param is also set.
        explode: true
        in: query
        name: include_pending
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: "By default, custom and plaid metadata are not included in the\
          \ response.  Set to true if you'd like the returned transactions objects\
          \ to include any  metadata associated with the transactions."
        explode: true
        in: query
        name: include_metadata
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: "By default, transactions that were split into multiple transactions\
          \ are not included in the response. Set to true if you'd like the returned\
          \ transactions objects to include any  transactions that were split into\
          \ multiple transactions.  Use with caution as this data is normally not\
          \ exposed after the split transactions are created."
        explode: true
        in: query
        name: include_split_parents
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: "By default, individual transactions that joined into a transaction\
          \ group are not included in the response. Set to true if you'd like the\
          \ returned transactions objects to include any transactions that joined\
          \ into a transaction group."
        explode: true
        in: query
        name: include_group_children
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: "By default, the `children` property is not included in the response.\
          \ Set to true if you'd like the children property to be populated with the\
          \ transactions that  make up a transaction group, or, if the `include_split_parents`\
          \ query param is also set,  the transactions that were split from a parent\
          \ transaction."
        explode: true
        in: query
        name: include_children
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: "By default, the `files` property is not included in the response.\
          \ Set to true if you'd like the responses to include a list of of  objects\
          \ that describe any files attached to the transactions."
        explode: true
        in: query
        name: include_files
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: "Sets the maximum number of transactions to return. If more match\
          \ the filter criteria, the response will include a `has_more` attribute\
          \ set to `true`. See [Pagination](https://alpha.lunchmoney.dev/v2/pagination)"
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 1000
          maximum: 2000
          minimum: 1
          type: integer
        style: form
      - description: "Sets the offset for the records returned. This is typically\
          \ set automatically in the header. See [Pagination](https://alpha.lunchmoney.dev/v2/pagination)"
        explode: true
        in: query
        name: offset
        required: false
        schema:
          type: integer
        style: form
