name: docs
on:
    push:
        paths:
            - openapi.yaml
            - docs/**
    pull_request:
        paths:
            - openapi.yaml
            - docs/**
    workflow_run:
        workflows: ["generate"]
        types:
            - completed
    workflow_dispatch:
jobs:
    docs:
        name: docs
        runs-on: ubuntu-latest
        if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: checkout
              uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
              with:
                  repository: ${{ github.event.workflow_run.head_repository.full_name || github.repository }}
                  ref: ${{ github.event.workflow_run.head_sha || github.ref }}
            - name: spec
              run: cp openapi.yaml docs/openapi.yaml
            - name: configure-page
              uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
            - name: upload-pages-artifact
              uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              with:
                  path: docs
            - name: deploy-pages
              id: deployment
              uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
