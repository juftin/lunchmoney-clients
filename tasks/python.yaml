# yaml-language-server: $schema=https://www.taskfile.dev/schema.json

version: "3"
vars:
    CLIENT_NAME: "{{.CLIENT_NAME}}"
    CLIENT_DIR: "{{.ROOT_DIR}}/clients/{{.CLIENT_NAME}}"
env:
    UV_PYTHON: "{{.UV_PYTHON}}"
tasks:
    #######################################
    # Client Tasks
    #######################################
    install:
        desc: Install Project + Dev Dependencies
        cmds:
            - cmd: uv venv --clear
            - cmd: uv pip install httpx pytest-cov .
        env:
            UV_PYTHON: "{{.UV_PYTHON}}"
    #######################################
    publish:
        desc: Publish Package
        cmds:
            - rm -rf "{{.CLIENT_DIR}}/dist"
            - uv build --out-dir "{{.CLIENT_DIR}}/dist"
            - uv publish "{{.CLIENT_DIR}}/dist/*"
    #######################################
    test:
        desc: Run Tests with different Python versions
        cmds:
            - uv run --no-sync python -m pytest --cov=lunchmoney
        deps:
            - install
    #######################################
    postprocess:
        desc: Post-Process Generated Code
        cmds:
            - |
                uv tool run --isolated \
                  --from toml-cli \
                  toml set \
                  --toml-path pyproject.toml \
                  project.name "{{.PROJECT_NAME}}"
        requires:
            vars:
                - PROJECT_NAME
    #######################################
    version:
        desc: Set the Generator Config Version
        dir: "{{.ROOT_DIR}}"
        cmds:
            - cmd: |
                  jq --indent 4 \
                    --arg version "{{.VERSION}}" \
                    '."generator-cli".generators.{{.VERSION_PATH}} = $version' \
                    openapitools.json \
                    > openapitools.tmp.json && \
                    mv openapitools.tmp.json openapitools.json
    #######################################
    clean:
        desc: Clean Generated Client Code
        cmds:
            - cmd: rm -rf {{.ROOT_DIR}}/clients/{{.CLIENT_NAME}}
