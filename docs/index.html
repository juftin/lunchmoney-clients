<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="SwaggerUI" />
        <title>SwaggerUI</title>
        <link
            href="https://static1.smartbear.co/swagger/media/assets/swagger_fav.png"
            type="image/png"
            rel="icon"
        />
        <link
            rel="stylesheet"
            href="https://unpkg.com/swagger-ui-dist@5.30.2/swagger-ui.css"
        />
    </head>
    <body>
        <div
            style="
                background: #f6f8fa;
                color: #24292f;
                padding: 8px 20px;
                font-size: 15px;
                text-align: center;
                border-radius: 6px;
                box-shadow: 0 1px 4px rgba(27, 31, 35, 0.04);
                margin: 16px auto 24px auto;
                max-width: 480px;
                border: 1px solid #d0d7de;
                font-family:
                    -apple-system,
                    BlinkMacSystemFont,
                    Segoe UI,
                    Helvetica,
                    Arial,
                    sans-serif;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
            "
        >
            <svg
                height="20"
                width="20"
                viewBox="0 0 16 16"
                fill="#24292f"
                aria-hidden="true"
                style="vertical-align: middle"
            >
                <path
                    d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.65 7.65 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.19 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"
                ></path>
            </svg>
            <span>Find Your Client:</span>
            <a
                href="https://github.com/juftin/lunchmoney-clients"
                target="_blank"
                style="color: #0969da; text-decoration: none; font-weight: 500"
            >
                juftin/lunchmoney-clients
            </a>
        </div>
        <div id="swagger-ui"></div>
        <script
            src="https://unpkg.com/swagger-ui-dist@5.30.2/swagger-ui-bundle.js"
            crossorigin
        ></script>
        <script>
            window.onload = () => {
                window.ui = SwaggerUIBundle({
                    url: "./openapi.yaml",
                    dom_id: "#swagger-ui",
                });
            };
        </script>
    </body>
</html>
